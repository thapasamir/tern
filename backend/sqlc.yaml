version: "2"

# One entry per feature: each feature owns its queries.sql and gets its own generated package.
# The schema is read straight from the goose migrations, so there is a single source of truth.
# Type overrides are defined once (see the anchor) and shared by every feature.
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/features/tenant/queries.sql
    gen:
      go:
        package: tenantdb
        out: internal/features/tenant/db
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides: &overrides
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: int32
              pointer: true

  - engine: postgresql
    schema: migrations
    queries: internal/features/endpoint/queries.sql
    gen:
      go:
        package: endpointdb
        out: internal/features/endpoint/db
        sql_package: pgx/v5
        emit_empty_slices: true
        rename:
          url: URL
        overrides: *overrides

  - engine: postgresql
    schema: migrations
    queries: internal/features/event/queries.sql
    gen:
      go:
        package: eventdb
        out: internal/features/event/db
        sql_package: pgx/v5
        emit_empty_slices: true
        rename:
          url: URL
        overrides: *overrides

  - engine: postgresql
    schema: migrations
    queries: internal/features/delivery/queries.sql
    gen:
      go:
        package: deliverydb
        out: internal/features/delivery/db
        sql_package: pgx/v5
        emit_empty_slices: true
        rename:
          url: URL
          endpoint_url: EndpointURL
        overrides: *overrides

  - engine: postgresql
    schema: migrations
    queries: internal/features/stats/queries.sql
    gen:
      go:
        package: statsdb
        out: internal/features/stats/db
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides: *overrides

  - engine: postgresql
    schema: migrations
    queries: internal/features/retention/queries.sql
    gen:
      go:
        package: retentiondb
        out: internal/features/retention/db
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides: *overrides
