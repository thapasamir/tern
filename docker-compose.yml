# The project name is set explicitly so that container and volume names do not depend on
# the name of the folder the repository happens to live in.
name: tern

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tern
      POSTGRES_PASSWORD: tern
      POSTGRES_DB: tern
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tern"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
