name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: make lint
      - name: Generated code is up to date
        run: make sqlc-check
      - name: Tests
        run: go test -race -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types match the OpenAPI document
        run: |
          pnpm gen:api
          git diff --exit-code -- src/shared/api/schema.d.ts
      - name: Lint, typecheck, tests, formatting
        run: pnpm check
      - name: Build
        run: pnpm build

  # Real Postgres and Redis in containers; the runner already has Docker.
  integration:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Integration tests
        run: make test-integration

  # The end-to-end scripts run the real binaries against real Postgres and Redis.
  smoke:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Configuration
        run: |
          cp .env.example .env
          echo "SECRETS_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> .env   # later lines win
      - name: Start Postgres and Redis
        run: make up
      - name: Migrate
        run: make migrate-up
      - name: End-to-end checks
        run: make smoke

  images:
    runs-on: ubuntu-latest
    needs: backend
    strategy:
      matrix:
        target: [api, worker, migrate]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.target }}
        run: docker build --target ${{ matrix.target }} backend
